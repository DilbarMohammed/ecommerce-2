{% extends "base.html" %}

{% block title %}Delete Address | Shop{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="bg-white border rounded-3 p-4 shadow-sm">
                <h1 class="h4 mb-3">Delete address?</h1>
                <p class="text-muted">This saved address will be removed from your account.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
